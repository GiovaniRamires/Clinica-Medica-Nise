spring.application.name=ClinicaMedicaNuse

# ---------------------------------------------------------------------------
# Banco de dados (MySQL em runtime; os testes usam H2, ver src/test/resources)
# ---------------------------------------------------------------------------
# Sem CLINICA_DB_URL a aplicacao sobe num MySQL local padrao - ajuste via
# variavel de ambiente para outro host/porta/schema. O usuario/senha tambem
# vem de variavel, sem segredo fixo no repositorio.
spring.datasource.url=${CLINICA_DB_URL:jdbc:mysql://localhost:3306/clinica_nise?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${CLINICA_DB_USUARIO:root}
spring.datasource.password=${CLINICA_DB_SENHA:}

# O schema e gerado pelo proprio Hibernate (projeto academico, sem Flyway).
# "update" preserva dados entre reinicios; nunca usar em producao com dados reais.
# O dialeto nao precisa ser declarado: o Spring Boot 4 / Hibernate 7 o detectam
# a partir da URL JDBC.
spring.jpa.hibernate.ddl-auto=update

# As respostas da API sao montadas em DTOs dentro do controller, nao em views,
# entao nao precisamos manter a sessao do JPA aberta durante a renderizacao.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Seguranca (Spring Security + JWT HS256 + BCrypt)
# ---------------------------------------------------------------------------
# Chave de assinatura do token: minimo 32 caracteres. Fica de fora do
# repositorio de proposito - defina a variavel de ambiente CLINICA_JWT_SECRET.
# Sem ela, a aplicacao sorteia uma chave a cada inicializacao (os tokens
# emitidos param de valer quando ela reinicia).
clinica.jwt.secret=${CLINICA_JWT_SECRET:}
clinica.jwt.expiracao-minutos=120

# Primeiro administrador, criado so quando nao existe nenhum usuario.
# Sem CLINICA_ADMIN_SENHA a senha e sorteada e aparece uma vez no log.
clinica.admin.email=${CLINICA_ADMIN_EMAIL:admin@clinicanise.local}
clinica.admin.senha=${CLINICA_ADMIN_SENHA:}
