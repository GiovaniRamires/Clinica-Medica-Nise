spring.application.name=ClinicaMedicaNuse
spring.datasource.url=jdbc:h2:mem:ClinicaMedicaNuse
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# As respostas da API sao montadas em DTOs dentro do controller, nao em views,
# entao nao precisamos manter a sessao do JPA aberta durante a renderizacao.
spring.jpa.open-in-view=false
