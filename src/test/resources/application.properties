# Configuracao exclusiva dos testes automatizados (src/test/resources tem
# prioridade sobre src/main/resources no classpath de teste): H2 em memoria,
# para nao depender de um MySQL real rodando so para `mvn test`.
spring.application.name=ClinicaMedicaNuse

spring.datasource.url=jdbc:h2:mem:ClinicaMedicaNuseTest;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

clinica.jwt.secret=${CLINICA_JWT_SECRET:}
clinica.jwt.expiracao-minutos=120
clinica.admin.email=${CLINICA_ADMIN_EMAIL:admin@clinicanise.local}
clinica.admin.senha=${CLINICA_ADMIN_SENHA:}
